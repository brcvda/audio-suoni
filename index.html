<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioguida</title>

    style.css
</head>

<body>

    <div class="container">

        <h1>🎧 Audioguida</h1>

        <p class="subtitle">
            Seleziona una traccia per iniziare l'ascolto.
        </p>

        <button onclick="playTrack('audio/introduzione.mp3', 'Introduzione')">
            ▶ Introduzione
        </button>

        <button onclick="playTrack('audio/storia.mp3', 'Storia')">
            ▶ Storia
        </button>

        <button onclick="playTrack('audio/approfondimento.mp3', 'Approfondimento')">
            ▶ Approfondimento
        </button>

        <button onclick="playTrack('audio/conclusioni.mp3', 'Conclusioni')">
            ▶ Conclusioni
        </button>

    </div>

    <div id="player">
        <h3 id="track-title">
            Nessuna traccia selezionata
        </h3>

        <audio id="audioPlayer" controls>
            Il tuo browser non supporta l'elemento audio.
        </audio>
    </div>

    app.jsscript>

</body>
</html>
