<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suoni della Memoria</title>

    <style>

        :root{
            --orange:#ef7200;
            --orange-dark:#d86400;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            background:#f5f5f5;
            font-family:Arial, Helvetica, sans-serif;
            color:#111;
        }

        .header{
            text-align:center;
            padding:15px 15px 20px;
            background:white;
        }

        .logo{
            width:90px;
            height:auto;
            display:block;
            margin:0 auto 10px auto;
        }

        .title{
            font-size:2rem;
            font-weight:900;
            margin-bottom:8px;
        }

        .subtitle{
            font-size:1rem;
            font-weight:600;
        }

        .container{
            max-width:700px;
            margin:0 auto;
            padding:20px 15px 160px;
        }

        .track{
            width:100%;

            background:var(--orange);
            color:white;

            border:none;
            border-radius:20px;

            padding:26px 22px;

            margin-bottom:18px;

            font-size:1.35rem;
            font-weight:700;

            text-align:left;

            cursor:pointer;

            box-shadow:0 6px 14px rgba(0,0,0,.15);

            transition:.2s;
        }

        .track:hover{
            background:var(--orange-dark);
        }

        .track:active{
            transform:scale(.98);
        }

        .track-number{
            font-weight:900;
            margin-right:12px;
        }

        .player{
            position:fixed;
            left:0;
            right:0;
            bottom:0;

            background:white;

            padding:12px;

            border-top:4px solid var(--orange);

            box-shadow:0 -3px 12px rgba(0,0,0,.15);
        }

        .now-playing{
            text-align:center;
            font-weight:bold;
            margin-bottom:8px;
        }

        audio{
            width:100%;
        }

    </style>
</head>

<body>

    <header class="header">

        <img src="logo.png"
             alt="Logo"
             class="logo">

        <h1 class="title">SUONI DELLA MEMORIA</h1>

        <div class="subtitle">
            Seleziona una traccia
        </div>

    </header>

    <main class="container">

        <button
            class="track"
            onclick="playTrack('audio/01_Scanner-beep.mp3','Scanner Beep')">

            <span class="track-number">01</span>
            Scanner Beep

        </button>

        <button
            class="track"
            onclick="playTrack('audio/02_vinyl-crackles.wav','Vinyl Crackles')">

            <span class="track-number">02</span>
            Vinyl Crackles

        </button>

        <button
            class="track"
            onclick="playTrack('audio/03_CaricatoreDiapositive.wav','Caricatore Diapositive')">

            <span class="track-number">03</span>
            Caricatore Diapositive

        </button>

        <button
            class="track"
            onclick="playTrack('audio/04_dial-up-modem-connecting-to-the-internet.mp3','Dial-Up Modem')">

            <span class="track-number">04</span>
            Dial-Up Modem

        </button>

    </main>

    <div class="player">

        <div id="track-title" class="now-playing">
            Nessuna traccia selezionata
        </div>

        <audio id="audioPlayer" controls></audio>

    </div>

    <script>

        const player = document.getElementById("audioPlayer");
        const trackTitle = document.getElementById("track-title");

        function playTrack(url, title){

            trackTitle.textContent = title;

            player.src = url;

            player.load();

            player.play().catch(error => {
                console.error(error);
            });
        }

    </script>

</body>

</html>
