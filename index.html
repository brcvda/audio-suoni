<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Suoni della Memoria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect.com

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

 111111;
            --white: #ffffff;
            --background: #f5f5f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--black);
            font-family: "Source Sans 3", sans-serif;
        }

        .header {
            background: white;
            text-align: center;
            padding: 12px;
            border-bottom: 4px solid var(--orange);
        }

        .logo {
            width: 110px;
            height: auto;
            display: block;
            margin: 0 auto 12px auto;
        }

        .title {
            margin: 0;
            font-family: "Oswald", sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--orange);
            font-weight: 600;
            font-size: 1rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 14px;
            padding-bottom: 160px;
        }

        .track {
            width: 100%;
            border: none;
            border-radius: 18px;

            background: var(--orange);
            color: white;

            padding: 28px 24px;

            margin-bottom: 18px;

            text-align: left;

            font-size: 1.3rem;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 6px 14px rgba(0, 0, 0, .15);

            transition: all .2s ease;
        }

        .track:hover {
            background: var(--orange-dark);
        }

        .track:active {
            transform: scale(0.98);
        }

        .track-number {
            color: white;
            font-weight: 900;
            font-size: 1.4rem;
            margin-right: 12px;
        }

        .player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            background: white;

            border-top: 5px solid var(--orange);

            padding: 12px 15px;

            box-shadow: 0 -4px 15px rgba(0, 0, 0, .15);
        }

        .now-playing {
            text-align: center;
            font-family: "Oswald", sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
        }

    </style>
</head>

<body>

    <header class="header">

        <img
            src="logo.png"
            alt="30 anni insieme"
            class="logo">

        <h1 class="title">Suoni della Memoria</h1>

        <div class="subtitle">
            Seleziona una traccia
        </div>

    </header>

    <main class="container">

        <button
            class="track"
            onclick="playTrack('audio/01_Scanner-beep.mp3','Scanner Beep')">

            <span class="track-number">01</span>
            Scanner Beep

        </button>

        <button
            class="track"
            onclick="playTrack('audio/02_vinyl-crackles.wav','Vinyl Crackles')">

            <span class="track-number">02</span>
            Vinyl Crackles

        </button>

        <button
            class="track"
            onclick="playTrack('audio/03_CaricatoreDiapositive.wav','Caricatore Diapositive')">

            <span class="track-number">03</span>
            Caricatore Diapositive

        </button>

        <button
            class="track"
            onclick="playTrack('audio/04_dial-up-modem-connecting-to-the-internet.mp3','Dial-Up Modem')">

            <span class="track-number">04</span>
            Dial-Up Modem

        </button>

    </main>

    <div class="player">

        <div id="track-title" class="now-playing">
            Nessuna traccia selezionata
        </div>

        <audio id="audioPlayer" controls>
            Il browser non supporta l'audio.
        </audio>

    </div>

    <script>

        const player = document.getElementById("audioPlayer");
        const trackTitle = document.getElementById("track-title");

        function playTrack(url, title) {

            trackTitle.textContent = title;

            player.src = url;

            player.load();

            player.play().catch(error => {
                console.error(error);
            });
        }

    </script>

</body>
</html>
