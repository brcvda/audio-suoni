<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suoni della Memoria</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4K3XRX8V4K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-4K3XRX8V4K');
    </script>

    <style>

        :root{
            --orange:#ef7200;
            --orange-dark:#d86400;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            background:#f5f5f5;
            font-family:Arial, Helvetica, sans-serif;
            color:#111;
        }

        .header{
            text-align:center;
            padding:15px 15px 20px;
            background:#ffffff;
        }

        .logo{
            width:90px;
            height:auto;
            display:block;
            margin:0 auto 12px auto;
        }

        .title{
            font-size:2rem;
            font-weight:900;
            margin-bottom:8px;
        }

        .subtitle{
            font-size:1rem;
            font-weight:600;
        }

        .container{
            max-width:800px;
            margin:0 auto;
            padding:20px 15px 180px;
        }

        .track{
            width:100%;
            border:none;
            border-radius:20px;
            background:var(--orange);
            color:white;
            padding:24px;
            margin-bottom:16px;
            text-align:left;
            font-size:1.15rem;
            font-weight:700;
            line-height:1.4;
            cursor:pointer;
            box-shadow:0 6px 14px rgba(0,0,0,.15);
            transition:all .2s ease;
        }

        .track:hover{
            background:var(--orange-dark);
        }

        .track:active{
            transform:scale(.98);
        }

        .track-number{
            display:inline-block;
            min-width:36px;
            font-weight:900;
            color:white;
        }

        .player{
            position:fixed;
            left:0;
            right:0;
            bottom:0;
            background:#ffffff;
            padding:12px;
            border-top:4px solid var(--orange);
            box-shadow:0 -3px 12px rgba(0,0,0,.15);
        }

        .now-playing{
            text-align:center;
            font-weight:bold;
            margin-bottom:8px;
            padding:0 10px;
        }

        audio{
            width:100%;
        }

        @media (max-width:768px){

            .logo{
                width:75px;
            }

            .title{
                font-size:1.8rem;
            }

            .track{
                padding:22px;
                font-size:1.05rem;
            }
        }

    </style>
</head>

<body>

    <header class="header">

        <img
            src="logo.png"
            alt="Logo"
            class="logo">

        <h1 class="title">SUONI DELLA MEMORIA</h1>

        <div class="subtitle">
            Seleziona una traccia
        </div>

    </header>

    <main class="container">

        <button
            class="track"
            onclick="playTrack('audio/Introduzione.mp3','Benvenuto')">

            <span class="track-number">00</span>
            Benvenuto

        </button>

        <button
            class="track"
            onclick="playTrack('audio/01_Scanner-beep.mp3','Il caratteristico bip squillante del lettore barcode ottico al banco prestiti')">

            <span class="track-number">01</span>
            Il caratteristico "bip" squillante del lettore barcode ottico al banco prestiti

        </button>

        <button
            class="track"
            onclick="playTrack('audio/02_vinyl-crackles.wav','Il fruscio del solco iniziale di un 33 giri sul giradischi')">

            <span class="track-number">02</span>
            Il fruscio del solco iniziale di un 33 giri sul giradischi

        </button>

        <button
            class="track"
            onclick="playTrack('audio/03_CaricatoreDiapositive.wav','Lo scatto secco del caricatore rotante Kodak Ektapro')">

            <span class="track-number">03</span>
            Lo scatto secco del caricatore rotante Kodak Ektapro

        </button>

        <button
            class="track"
            onclick="playTrack('audio/04_dial-up-modem-connecting-to-the-internet.mp3','La sequenza di negoziazione e sibilo del modem USRobotics a 28.800 bps')">

            <span class="track-number">04</span>
            La sequenza di negoziazione e sibilo del modem USRobotics a 28.800 bps

        </button>

        <button
            class="track"
            onclick="playTrack('audio/05_braille-printer.mp3','La sequenza battente dei punzoni della stampante Braille')">

            <span class="track-number">05</span>
            La sequenza battente dei punzoni della stampante Braille

        </button>

    </main>

    <div class="player">

        <div id="track-title" class="now-playing">
            Nessuna traccia selezionata
        </div>

        <audio id="audioPlayer" controls>
            Il browser non supporta l'audio.
        </audio>

    </div>

    <script>

        const player = document.getElementById("audioPlayer");
        const trackTitle = document.getElementById("track-title");

        function playTrack(url, title){

            trackTitle.textContent = title;

            player.src = url;

            player.load();

            if (typeof gtag === "function") {
                gtag("event", "play_audio", {
                    audio_title: title
                });
            }

            player.play().catch(error => {
                console.error(error);
            });
        }

    </script>

</body>
</html>
