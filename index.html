<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>30 Anni Insieme | Audioguida</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect.com

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

           --light:#f5f5f5;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:var(--light);
            font-family:'Source Sans 3',sans-serif;
            color:var(--black);
        }

        .header{
            background:white;
            padding:30px 20px;
            text-align:center;
            border-bottom:6px solid var(--orange);
        }

        .logo{
            width:220px;
            max-width:80%;
            margin-bottom:20px;
        }

        .title{
            font-family:'Oswald',sans-serif;
            text-transform:uppercase;
            margin:0;
            font-size:2rem;
            letter-spacing:1px;
        }

        .subtitle{
            color:var(--orange);
            font-size:1.1rem;
            margin-top:8px;
        }

        .container{
            max-width:700px;
            margin:auto;
            padding:24px;
            padding-bottom:150px;
        }

        .track{
            width:100%;
            border:none;
            cursor:pointer;
            text-align:left;
            padding:18px;
            margin-bottom:12px;
            background:white;
            border-left:8px solid var(--orange);
            border-radius:10px;
            font-size:1.05rem;
            font-weight:600;
            transition:0.2s;
        }

        .track:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .track-number{
            color:var(--orange);
            font-weight:bold;
            margin-right:8px;
        }

        .footer{
            margin-top:25px;
            text-align:center;
            color:#666;
        }

        .player{
            position:fixed;
            left:0;
            right:0;
            bottom:0;
            background:white;
            padding:15px;
            border-top:5px solid var(--orange);
            box-shadow:0 -4px 12px rgba(0,0,0,.15);
        }

        .now-playing{
            text-align:center;
            font-family:'Oswald',sans-serif;
            margin-bottom:10px;
        }

        audio{
            width:100%;
        }

    </style>
</head>

<body>

<header class="header">

    <img src="logo.png"
         alt="Bibliothèque Régionale d'Aoste - 30 anni insieme"
         class="logo">

    <h1 class="title">Audioguida sonora</h1>

    <div class="subtitle">
        La storia continua
    </div>

</header>

<div class="container">

    <button class="track"
        onclick="playTrack('audio/01_Scanner-beep.mp3','Scanner Beep')">
        <span class="track-number">01</span>
        Scanner Beep
    </button>

    <button class="track"
        onclick="playTrack('audio/02_vinyl-crackles.wav','Vinyl Crackles')">
        <span class="track-number">02</span>
        Vinyl Crackles
    </button>

    <button class="track"
        onclick="playTrack('audio/03_CaricatoreDiapositive.wav','Caricatore Diapositive')">
        <span class="track-number">03</span>
        Caricatore Diapositive
    </button>

    <button class="track"
        onclick="playTrack('audio/04_dial-up-modem-connecting-to-the-internet.mp3','Dial-Up Modem')">
        <span class="track-number">04</span>
        Dial-Up Modem
    </button>

    <div class="footer">
        Bibliothèque Régionale d'Aoste • 30 anni insieme
    </div>

</div>

<div class="player">

    <div id="track-title" class="now-playing">
        Seleziona una traccia
    </div>

    <audio id="audioPlayer" controls></audio>

</div>

<script>

const player = document.getElementById("audioPlayer");
const title = document.getElementById("track-title");

function playTrack(url, trackName) {

    title.textContent = trackName;

    player.src = url;

    player.play().catch(error => {
        console.log(error);
    });
}

</script>

</body>
</html>
